server:
  # Render sets PORT. Fall back to SERVER_PORT, then 8080 for local dev.
  port: ${PORT:${SERVER_PORT:8080}}
  # Bind to all interfaces so Render (and Docker) can reach the app
  address: 0.0.0.0

spring:
  application:
    name: chatspark-backend
  datasource:
    # Render provides DATABASE_URL as postgres://user:pass@host/db
    # Spring Boot needs jdbc:postgresql://user:pass@host/db
    # We use a workaround: set the full JDBC URL in SPRING_DATASOURCE_URL on Render,
    # and fall back to the local PostgreSQL for development.
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/chatspark}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8081,http://127.0.0.1:5173}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
